name: Deploy LookbookMaker

on:
  push:
    branches:
      - main

concurrency:
  group: lookbook-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e

            cd /opt/apps/rashi-kapoor/lookbook-maker

            echo "==> Fetching latest code"
            git fetch origin main
            git reset --hard origin/main

            echo "==> Building Lookbook"
            docker compose build

            echo "==> Starting Lookbook"
            docker compose up -d

            echo "==> Waiting for service"
            sleep 10

            echo "==> Checking container"
            docker compose ps

            echo "==> Checking Lookbook"
            curl -fsSI http://127.0.0.1:3001

            echo ""
            echo "==> Lookbook deployment successful"
