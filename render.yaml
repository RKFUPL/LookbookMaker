services:
  - type: web
    name: rk-fashion-catalog
    runtime: docker
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: npm run start:render
    plan: starter
    numInstances: 1
    healthCheckPath: /login
    envVars:
      - key: APP_URL
        value: https://lookbookmaker.onrender.com
      - key: PORT
        value: "10000"
      - key: MONGODB_URI
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: SESSION_TTL_HOURS
        value: "12"
      - key: STORAGE_DRIVER
        value: s3
      - key: R2_ENDPOINT
        sync: false
      - key: R2_REGION
        value: auto
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: R2_FORCE_PATH_STYLE
        value: "false"
      - key: SIGNED_URL_TTL_SECONDS
        value: "3600"
      - key: MAX_PDF_SIZE_MB
        value: "250"
      - key: MAX_COVER_SIZE_MB
        value: "10"
      - key: PDFINFO_BIN
        value: pdfinfo
      - key: PDFTOPPM_BIN
        value: pdftoppm
      - key: WORKER_POLL_MS
        value: "2500"
      - key: WORKER_MAX_ATTEMPTS
        value: "3"
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: staff@rashikapoorofficial.com
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        value: RK Staff
