services:
  - type: web
    name: rk-fashion-catalog
    runtime: docker
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: npm run start:render
    plan: free
    numInstances: 1
    healthCheckPath: /api/health/storage
    envVars:
      - key: APP_URL
        value: https://lookbookmaker.onrender.com
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: MONGODB_URI
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: SESSION_TTL_HOURS
        value: "12"
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: staff@rashikapoorofficial.com
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        value: RK Staff
