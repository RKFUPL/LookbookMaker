services:
  app:
    build: .
    container_name: lookbook-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:10000"
    env_file:
      - .env
    environment:
      APP_URL: https://lookbook.physihome.shop
      PORT: "10000"
      LOOKBOOK_STORAGE_DIR: /data/lookbooks
    volumes:
      - ${LOOKBOOK_STORAGE_HOST_DIR:-/opt/apps/rashi-kapoor/lookbook-maker-storage/pdfs}:/data/lookbooks
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:10000/api/health/storage').then(async (response) => { if (response.status !== 200 || (await response.json()).ok !== true) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  seed-admin:
    profiles: ["setup"]
    build: .
    container_name: lookbook-seed-admin
    command: ["npm", "run", "seed:admin"]
    env_file:
      - .env
    environment:
      APP_URL: https://lookbook.physihome.shop
      PORT: "10000"
      LOOKBOOK_STORAGE_DIR: /data/lookbooks
    volumes:
      - ${LOOKBOOK_STORAGE_HOST_DIR:-/opt/apps/rashi-kapoor/lookbook-maker-storage/pdfs}:/data/lookbooks
