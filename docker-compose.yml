services:
  app:
    build: .
    container_name: lookbook-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:10000"
    env_file:
      - .env
    environment:
      APP_URL: https://lookbook.physihome.shop
      PORT: "10000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:10000/api/health/storage"]
      interval: 30s
      timeout: 10s
      retries: 3

  seed-admin:
    profiles: ["setup"]
    build: .
    container_name: lookbook-seed-admin
    command: ["npm", "run", "seed:admin"]
    env_file:
      - .env
    environment:
      APP_URL: https://lookbook.physihome.shop
      PORT: "10000"
