services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - rk-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 4s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:10000"
    env_file: .env
    environment:
      APP_URL: http://localhost:3000
      PORT: "10000"
      MONGODB_URI: mongodb://mongo:27017/rk_catalogs
    depends_on:
      mongo:
        condition: service_healthy

  seed-admin:
    profiles: ["setup"]
    build: .
    command: ["npm", "run", "seed:admin"]
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/rk_catalogs
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  rk-mongo:
